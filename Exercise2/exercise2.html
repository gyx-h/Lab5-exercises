<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Geolocation</title>
</head>
<body>
    <h1>HTML5 Geolocation</h1>
    <!-- Button,calls the getGeolocation() function when clicked to get the location -->
    <button onclick="getGeolocation()">Get Geolocation</button>
    <!-- Paragraph used to display positioning results,initial prompt text -->
    <p id="geolocation">Your location will be displayed here.</p>
    <!-- Include external JS file,the positioning logic is written in geolocation.js -->
    <script src="geolocation.js"></script>
</body>
</html>
